<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work & OT Calculator</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5"> <!-- Matches Tailwind indigo-600 -->
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>

    <!-- Lucide Icons & Moment.js -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        input[type="time"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.5;
            transition: 0.2s;
        }

        input[type="time"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>

<body
    class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-100 selection:text-indigo-900">

    <div
        class="bg-white rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.06)] w-full max-w-md overflow-hidden border border-slate-200 transition-all">
        <!-- Header -->
        <div class="bg-indigo-600 px-6 py-5 text-white flex items-center gap-3">
            <i data-lucide="clock-4" class="w-6 h-6 text-indigo-200"></i>
            <div>
                <h1 class="text-lg font-semibold leading-tight">Time & OT Calculator</h1>
                <p class="text-indigo-200 text-xs mt-0.5">Auto-detects overnight shifts</p>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <!-- Start & End Time Inputs -->
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Start Time</label>
                    <input type="time" id="start-time" value="09:00"
                        class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-lg rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all shadow-sm">
                </div>
                <div class="space-y-1.5">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">End Time</label>
                    <input type="time" id="end-time" value="18:00"
                        class="w-full bg-slate-50 border border-slate-200 text-slate-800 text-lg rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all shadow-sm">
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- Breaks -->
            <div class="space-y-4">
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider flex items-center gap-2">
                    <i data-lucide="coffee" class="w-4 h-4"></i> Breaks & Deductions
                </h3>

                <!-- Lunch Break -->
                <div
                    class="bg-slate-50 rounded-2xl border border-slate-100 p-4 transition-colors hover:border-slate-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="utensils" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-slate-700">Lunch Break</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="lunch-check" class="sr-only peer" checked
                                onchange="toggleBreak('lunch')">
                            <div
                                class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500">
                            </div>
                        </label>
                    </div>
                    <div id="lunch-wrapper"
                        class="grid grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out">
                        <div class="overflow-hidden">
                            <div class="pt-3 flex items-center gap-2">
                                <input type="number" id="lunch-time" value="60" min="0"
                                    class="w-20 px-3 py-1.5 border border-slate-200 bg-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center font-medium text-slate-700">
                                <span class="text-sm text-slate-500">minutes</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dinner Break -->
                <div
                    class="bg-slate-50 rounded-2xl border border-slate-100 p-4 transition-colors hover:border-slate-200">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="moon" class="w-4 h-4 text-slate-400"></i>
                            <span class="font-medium text-slate-700">Dinner Break</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="dinner-check" class="sr-only peer"
                                onchange="toggleBreak('dinner')">
                            <div
                                class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-indigo-500">
                            </div>
                        </label>
                    </div>
                    <div id="dinner-wrapper"
                        class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out">
                        <div class="overflow-hidden">
                            <div class="pt-3 flex items-center gap-2">
                                <input type="number" id="dinner-time" value="60" min="0"
                                    class="w-20 px-3 py-1.5 border border-slate-200 bg-white rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-center font-medium text-slate-700">
                                <span class="text-sm text-slate-500">minutes</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="bg-indigo-50/50 rounded-2xl p-5 border border-indigo-100">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <p class="text-sm font-medium text-indigo-900/60 mb-1">Net Working Hours</p>
                        <div class="flex items-baseline gap-2">
                            <h2 class="text-3xl font-bold text-indigo-900" id="net-hours">0h 0m</h2>
                            <span class="text-sm font-medium text-indigo-900/50" id="net-decimal">(0.00)</span>
                        </div>
                    </div>
                </div>

                <div class="h-px w-full bg-indigo-200/50 mb-4"></div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs font-medium text-indigo-900/60 mb-1 flex items-center gap-1">
                            Regular (max
                            <input type="number" id="base-hours" value="8" min="1" max="24"
                                class="w-6 text-center bg-transparent border-b border-indigo-300 focus:border-indigo-600 outline-none text-indigo-900 p-0 m-0 leading-none font-bold">h)
                        </div>
                        <p class="text-lg font-semibold text-indigo-900" id="regular-hours">0h 0m</p>
                    </div>
                    <div>
                        <p class="text-xs font-medium text-indigo-900/60 mb-1">Overtime</p>
                        <p class="text-lg font-semibold text-slate-400 transition-colors duration-300" id="ot-hours">0h
                            0m</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const elStart = document.getElementById('start-time'), elEnd = document.getElementById('end-time');
        const elLunchCheck = document.getElementById('lunch-check'), elLunchTime = document.getElementById('lunch-time');
        const elDinnerCheck = document.getElementById('dinner-check'), elDinnerTime = document.getElementById('dinner-time');
        const elBaseHours = document.getElementById('base-hours');
        const outNet = document.getElementById('net-hours'), outNetDec = document.getElementById('net-decimal');
        const outRegular = document.getElementById('regular-hours'), outOT = document.getElementById('ot-hours');

        function toggleBreak(id) {
            const isChecked = document.getElementById(`${id}-check`).checked;
            document.getElementById(`${id}-wrapper`).className = isChecked
                ? 'grid grid-rows-[1fr] transition-[grid-template-rows] duration-300 ease-in-out'
                : 'grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out';
            calculate();
        }

        function formatTimeHM(mins) {
            const h = Math.floor(mins / 60), m = mins % 60;
            if (h === 0 && m === 0) return "0h 0m";
            return h === 0 ? `${m}m` : `${h}h ${m}m`;
        }

        function calculate() {
            if (!elStart.value || !elEnd.value) return;

            let start = moment(elStart.value, 'HH:mm'), end = moment(elEnd.value, 'HH:mm');
            if (end.isBefore(start)) end.add(1, 'day');

            let grossMinutes = end.diff(start, 'minutes');
            let deductMins = 0;
            if (elLunchCheck.checked) deductMins += parseInt(elLunchTime.value || 0);
            if (elDinnerCheck.checked) deductMins += parseInt(elDinnerTime.value || 0);

            let netMinutes = Math.max(0, grossMinutes - deductMins);
            const baseMinutes = parseInt(elBaseHours.value || 8) * 60;
            const regularMinutes = Math.min(netMinutes, baseMinutes);
            const otMinutes = Math.max(0, netMinutes - regularMinutes);

            outNet.textContent = formatTimeHM(netMinutes);
            outNetDec.textContent = `(${(netMinutes / 60).toFixed(2)}h)`;
            outRegular.textContent = formatTimeHM(regularMinutes);
            outOT.textContent = formatTimeHM(otMinutes);

            outOT.className = otMinutes > 0 ? 'text-lg font-semibold text-emerald-600 transition-colors duration-300' : 'text-lg font-semibold text-slate-400 transition-colors duration-300';
        }

        [elStart, elEnd, elLunchTime, elDinnerTime, elBaseHours].forEach(input => input.addEventListener('input', calculate));
        calculate();

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => console.log('SW registration failed'));
            });
        }
    </script>
</body>

</html>
